# Configuracao nginx para o Sistema RH Palmarante
# Instalar: sudo ln -sf /caminho/para/este/arquivo /etc/nginx/sites-enabled/palmarante-rh
# E depois: sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name 177.190.69.20;

    # Redirecionar HTTP para HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 177.190.69.20;

    # SSL - ajustar caminhos se necessario
    ssl_certificate     /etc/letsencrypt/live/177.190.69.20/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/177.190.69.20/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Logs
    access_log /var/log/nginx/palmarante-rh-access.log;
    error_log  /var/log/nginx/palmarante-rh-error.log;

    # Tamanho maximo de upload (para fotos, curriculos, etc.)
    client_max_body_size 20M;

    # Raiz do projeto
    root /home/palmarante/palmarante-loja;

    # Arquivos estaticos - servidos diretamente pelo nginx
    location ~* \.(html|css|js|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|pdf|xls|csv)$ {
        expires 1h;
        add_header Cache-Control "public, no-transform";
        try_files $uri @proxy;
    }

    # API - proxy para o servidor Python
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Uploads - servir diretorio com protecao
    location /uploads/ {
        internal;  # So acessivel via redirecionamento interno (X-Accel-Redirect)
        alias /home/palmarante/palmarante-loja/uploads/;
    }

    # Todo o resto vai para o Python
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
